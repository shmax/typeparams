name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "npm dist-tag (e.g., latest, next, rc)"
        required: false
        default: "next"
  push:
    tags:
      - "v*"
      - "[0-9]*"

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      PUBLISH_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || 'next' }}
      HAS_NPM_TOKEN: ${{ secrets.NPM_TOKEN != '' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "yarn"
          scope: "@shmax-org"
          always-auth: true
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build project
        run: yarn build

      - name: Verify npm registry
        run: |
          npm config get registry
          npm config get @shmax-org:registry

      - name: Verify npm auth token
        if: env.HAS_NPM_TOKEN == 'true'
        run: npm whoami
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish to npm (token)
        if: env.HAS_NPM_TOKEN == 'true'
        run: npm publish --provenance --access public --tag "$PUBLISH_TAG"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish to npm (trusted publishing)
        if: env.HAS_NPM_TOKEN != 'true'
        run: npm publish --provenance --access public --tag "$PUBLISH_TAG"
